# Prometheus scrapes the OTel Collector's own Prometheus exporter
# (otel-collector-config.yaml's `prometheus` exporter, :8889/metrics) -
# Prometheus never talks to app.py directly, the same way Jaeger never
# did in Nidan. One ingestion path (OTLP into the Collector), two
# backends fanned out from it per signal type.
global:
  scrape_interval: 10s

scrape_configs:
  - job_name: "satark-otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
